<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כרם — מערכת רישיונות יבואן</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   רישיון יבואנים — design system
   Linear/Stripe-inspired, RTL Hebrew, calm professional SaaS
   ============================================================ */

:root {
  /* Neutrals — warm-ish gray scale */
  --bg: #ffffff;
  --bg-subtle: #fafafa;
  --bg-muted: #f5f5f6;
  --panel: #ffffff;
  --panel-hover: #f8f8f9;
  --border: #ececef;
  --border-strong: #d8d8dc;
  --divider: #f0f0f2;

  /* Text */
  --text: #18181b;
  --text-secondary: #50525a;
  --text-muted: #7a7c85;
  --text-disabled: #b4b6bd;

  /* Brand / accent */
  --accent: #5e6ad2;
  --accent-hover: #4d58c0;
  --accent-soft: #eef0fb;
  --accent-text: #3640a4;

  /* Status semantic */
  --green: #1a7f4e;
  --green-soft: #e6f4ec;
  --amber: #b06b00;
  --amber-soft: #fdf3df;
  --red: #c1313b;
  --red-soft: #fbeaec;
  --blue: #1e64bd;
  --blue-soft: #e7f0fb;
  --purple: #7548c8;
  --purple-soft: #f1ebfb;
  --cyan: #0c7b89;
  --cyan-soft: #e0f4f6;
  --gray-soft: #f0f0f2;
  --gray-text: #555560;

  /* Shadows — subtle, Linear-style */
  --shadow-sm: 0 1px 2px rgba(17, 17, 26, 0.04);
  --shadow-md: 0 2px 6px rgba(17, 17, 26, 0.05), 0 1px 2px rgba(17, 17, 26, 0.06);
  --shadow-lg: 0 8px 24px rgba(17, 17, 26, 0.08), 0 2px 6px rgba(17, 17, 26, 0.04);
  --shadow-xl: 0 20px 48px rgba(17, 17, 26, 0.12), 0 4px 12px rgba(17, 17, 26, 0.06);

  /* Radius */
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;

  /* Layout */
  --sidebar-w: 232px;
  --topbar-h: 56px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-subtle);
  color: var(--text);
  font-family: 'Heebo', 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  font-feature-settings: "ss01", "cv02";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  direction: rtl;
  text-rendering: optimizeLegibility;
}

#root { min-height: 100vh; }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  direction: rtl;
}

a { color: inherit; text-decoration: none; }

.mono { font-family: 'JetBrains Mono', 'SFMono-Regular', monospace; font-size: 0.92em; letter-spacing: -0.01em; }

/* ============================================================
   App layout
   ============================================================ */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
  background: var(--bg-subtle);
}

.app[data-external="true"] {
  grid-template-columns: 1fr;
}

.app[data-external="true"] .sidebar { display: none; }

/* Sidebar */
.sidebar {
  background: var(--bg);
  border-inline-start: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--divider);
  height: var(--topbar-h);
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: linear-gradient(135deg, #5e6ad2 0%, #7c4dff 100%);
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.1), 0 1px 2px rgba(94,106,210,.3);
}

.brand-text { font-weight: 600; font-size: 14px; color: var(--text); letter-spacing: -.005em; }
.brand-sub { font-size: 11px; color: var(--text-muted); margin-top: -2px; }

.sidebar-section { padding: 12px 10px 4px; }
.sidebar-section-title {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--text-muted);
  padding: 0 10px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  margin-bottom: 1px;
  transition: background .12s, color .12s;
}

.nav-item:hover { background: var(--bg-muted); color: var(--text); }
.nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item[aria-current="true"] svg { color: var(--accent); }

.nav-item svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
.nav-item[aria-current="true"] svg { color: var(--accent); }

.nav-count {
  margin-inline-start: auto;
  font-size: 11px;
  background: var(--bg-muted);
  color: var(--text-secondary);
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 500;
}

.nav-item[aria-current="true"] .nav-count {
  background: rgba(94,106,210,.18);
  color: var(--accent-text);
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--divider);
}

/* Topbar */
.topbar {
  background: var(--bg);
  border-bottom: 1px solid var(--divider);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar-title { font-weight: 600; font-size: 14.5px; color: var(--text); }
.topbar-sub { color: var(--text-muted); font-size: 13px; font-weight: 400; }

.topbar-spacer { flex: 1; }

.topbar-search {
  position: relative;
  width: 280px;
}

.topbar-search input {
  width: 100%;
  background: var(--bg-muted);
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 6px 30px 6px 10px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: all .15s;
}

.topbar-search input:focus {
  background: var(--bg);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.topbar-search svg {
  position: absolute;
  inset-inline-end: 9px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--text-muted);
}

/* Role switcher */
.role-switcher {
  position: relative;
}

.role-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  background: var(--bg-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: all .12s;
  user-select: none;
}
.role-pill:hover { background: var(--bg); border-color: var(--border-strong); }

.role-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff8a4e, #d24f7f);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: grid;
  place-items: center;
}

.role-info { display: flex; flex-direction: column; line-height: 1.15; }
.role-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
.role-title { font-size: 10.5px; color: var(--text-muted); }

.role-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  inset-inline-start: 0;
  width: 280px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 50;
}

.role-dropdown-header {
  padding: 8px 10px;
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 500;
  letter-spacing: .04em;
  color: var(--text-muted);
}

.role-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .1s;
}
.role-option:hover { background: var(--bg-muted); }
.role-option[aria-selected="true"] { background: var(--accent-soft); }

.role-option .role-avatar { width: 30px; height: 30px; font-size: 12px; }
.role-option-text .role-name { font-size: 13px; }
.role-option-text .role-title { font-size: 11.5px; }

.role-divider {
  height: 1px;
  background: var(--divider);
  margin: 4px 0;
}

/* Workspace */
.workspace {
  padding: 24px 28px 56px;
  max-width: 1480px;
  margin: 0 auto;
  width: 100%;
}

.workspace.narrow { max-width: 1100px; }

/* Page header */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.page-title {
  font-size: 22px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -.012em;
  color: var(--text);
}
.page-subtitle {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ============================================================
   Components
   ============================================================ */

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
  line-height: 1.3;
  user-select: none;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 14px; height: 14px; }

.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.12);
}
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border-color: var(--border);
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover { background: var(--bg-muted); border-color: var(--border-strong); }

.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-muted); color: var(--text); }

.btn-danger {
  background: var(--red);
  color: #fff;
}
.btn-danger:hover { background: #a82731; }

.btn-success {
  background: var(--green);
  color: #fff;
}
.btn-success:hover { background: #156a3f; }

.btn-sm { padding: 4px 10px; font-size: 12.5px; }
.btn-lg { padding: 9px 18px; font-size: 14px; }
.btn-icon { padding: 6px; }
.btn-icon svg { width: 15px; height: 15px; }

.btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }

/* Badge / status pill */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.6;
}
.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.badge-gray   { background: var(--gray-soft);   color: var(--gray-text); }
.badge-blue   { background: var(--blue-soft);   color: var(--blue); }
.badge-green  { background: var(--green-soft);  color: var(--green); }
.badge-amber  { background: var(--amber-soft);  color: var(--amber); }
.badge-red    { background: var(--red-soft);    color: var(--red); }
.badge-purple { background: var(--purple-soft); color: var(--purple); }
.badge-cyan   { background: var(--cyan-soft);   color: var(--cyan); }
.badge-indigo { background: var(--accent-soft); color: var(--accent-text); }

/* Card / panel */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

.card-header {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--divider);
}
.card-title { font-size: 14px; font-weight: 600; margin: 0; color: var(--text); letter-spacing: -.005em;}
.card-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.card-body { padding: 16px 18px; }
.card-body.flush { padding: 0; }

/* Stat tile */
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.stat-label { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
.stat-value {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 4px;
}
.stat-num {
  font-size: 26px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.02em;
  line-height: 1.1;
}
.stat-delta { font-size: 12px; font-weight: 500; }
.stat-delta.up { color: var(--green); }
.stat-delta.down { color: var(--red); }
.stat-icon {
  position: absolute;
  inset-block-start: 12px;
  inset-inline-end: 14px;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
}
.stat-icon svg { width: 15px; height: 15px; }
.stat-icon.blue { background: var(--blue-soft); color: var(--blue); }
.stat-icon.green { background: var(--green-soft); color: var(--green); }
.stat-icon.amber { background: var(--amber-soft); color: var(--amber); }
.stat-icon.purple { background: var(--purple-soft); color: var(--purple); }
.stat-icon.red { background: var(--red-soft); color: var(--red); }

/* Table */
.tbl-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.tbl-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--divider);
  background: var(--panel);
}

.tbl-filter {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  font-size: 12.5px;
  background: var(--bg-muted);
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-secondary);
  cursor: pointer;
  font-weight: 500;
}
.tbl-filter:hover { background: var(--bg); border-color: var(--border); color: var(--text); }
.tbl-filter.active { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.tbl-filter svg { width: 12px; height: 12px; }

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--panel);
}

thead th {
  text-align: start;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 9px 14px;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--divider);
  text-transform: uppercase;
  letter-spacing: .03em;
  white-space: nowrap;
}

tbody tr { border-bottom: 1px solid var(--divider); transition: background .08s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--bg-subtle); }
tbody tr.clickable { cursor: pointer; }

tbody td {
  padding: 11px 14px;
  font-size: 13px;
  color: var(--text);
  vertical-align: middle;
}

td.muted { color: var(--text-muted); }
td.num { font-variant-numeric: tabular-nums; }

td.cell-id .mono { background: var(--bg-muted); padding: 2px 6px; border-radius: 4px; color: var(--text-secondary); font-size: 12px; }

.tbl-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-top: 1px solid var(--divider);
  color: var(--text-muted);
  font-size: 12.5px;
}

.tbl-pager { display: inline-flex; gap: 2px; }
.tbl-pager button {
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 5px;
  color: var(--text-secondary);
  cursor: pointer;
  display: inline-grid;
  place-items: center;
}
.tbl-pager button:hover:not([disabled]) { background: var(--bg-muted); }
.tbl-pager button[aria-current="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.tbl-pager button[disabled] { opacity: .4; cursor: not-allowed; }
.tbl-pager button svg { width: 12px; height: 12px; }

/* Form fields */
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.field-label {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-secondary);
}
.field-label .req { color: var(--red); margin-inline-start: 2px; }
.field-hint { font-size: 12px; color: var(--text-muted); }
.field-error { font-size: 12px; color: var(--red); margin-top: 2px; }

.input, .select, .textarea {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: all .12s;
  font-family: inherit;
}
.input:hover, .select:hover, .textarea:hover { border-color: var(--border-strong); }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input[readonly] { background: var(--bg-muted); color: var(--text-muted); }
.input.has-error { border-color: var(--red); }
.input.has-error:focus { box-shadow: 0 0 0 3px var(--red-soft); }
.textarea { resize: vertical; min-height: 76px; line-height: 1.5; }

.select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1l4 4 4-4' stroke='%237a7c85' stroke-width='1.5' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: left 12px center; padding-inline-start: 30px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px 16px;
}
.col-12 { grid-column: span 12; }
.col-6 { grid-column: span 6; }
.col-4 { grid-column: span 4; }
.col-3 { grid-column: span 3; }

@media (max-width: 720px) {
  .form-grid > * { grid-column: span 12; }
}

/* Section heading inside form */
.form-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  margin-bottom: 14px;
  overflow: hidden;
}
.form-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--divider);
  background: var(--bg-subtle);
}
.form-section-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin: 0; }
.form-section-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
.form-section-body { padding: 18px; }

/* Stepper */
.stepper {
  display: flex;
  gap: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 18px;
  align-items: center;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
}
.step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--bg-muted);
  color: var(--text-muted);
  font-size: 11.5px;
  font-weight: 600;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
}
.step.active { color: var(--text); }
.step.active .step-num { background: var(--accent); color: #fff; border-color: var(--accent); }
.step.done { color: var(--text-secondary); }
.step.done .step-num { background: var(--green); color: #fff; border-color: var(--green); }
.step-sep {
  flex: 1;
  height: 1px;
  background: var(--border);
  margin: 0 12px;
}
.step.done + .step-sep { background: var(--green); }

/* Filter chips / quick stat tabs */
.tabs {
  display: inline-flex;
  background: var(--bg-muted);
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
}
.tab {
  padding: 4px 12px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: 6px;
  cursor: pointer;
  background: transparent;
  border: none;
  transition: all .1s;
}
.tab[aria-selected="true"] { background: var(--bg); color: var(--text); box-shadow: var(--shadow-sm); }
.tab:hover:not([aria-selected="true"]) { color: var(--text); }

.tab-count {
  margin-inline-start: 5px;
  font-size: 11px;
  font-weight: 500;
  background: rgba(0,0,0,.06);
  padding: 0px 5px;
  border-radius: 4px;
  color: var(--text-muted);
}
.tab[aria-selected="true"] .tab-count { background: var(--accent-soft); color: var(--accent-text); }

/* Drawer / modal */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 17, 25, 0.32);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn .15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-xl);
  width: min(560px, calc(100vw - 32px));
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn .2s cubic-bezier(.2,.7,.2,1);
}
@keyframes modalIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 15px; font-weight: 600; margin: 0; }
.modal-close {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 5px;
  border-radius: 6px;
  color: var(--text-muted);
}
.modal-close:hover { background: var(--bg-muted); color: var(--text); }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--divider);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--bg-subtle);
}

/* Side drawer (for detail) */
.drawer {
  position: fixed;
  inset-block: 0;
  inset-inline-end: 0;
  width: min(640px, 100vw);
  background: var(--bg);
  z-index: 100;
  box-shadow: var(--shadow-xl);
  display: flex;
  flex-direction: column;
  animation: drawerIn .25s cubic-bezier(.2,.7,.2,1);
}
@keyframes drawerIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Charts */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}

.bar-row { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
.bar-label { font-size: 12.5px; color: var(--text-secondary); width: 170px; flex-shrink: 0; }
.bar-track { flex: 1; height: 8px; background: var(--bg-muted); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
.bar-value { font-size: 12.5px; color: var(--text); font-variant-numeric: tabular-nums; width: 40px; text-align: end; font-weight: 500; }

/* Donut chart wrapper */
.donut-row {
  display: flex;
  align-items: center;
  gap: 22px;
}
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; }
.legend-label { color: var(--text-secondary); flex: 1; }
.legend-value { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

/* Activity feed item */
.activity-item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--divider);
  align-items: flex-start;
}
.activity-item:last-child { border-bottom: none; }
.activity-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  color: #fff; font-size: 11px; font-weight: 600;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.activity-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.activity-text .who { font-weight: 600; }
.activity-text .what { color: var(--text-secondary); }
.activity-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

/* Tag / chip selection */
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: var(--bg-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  font-weight: 500;
}
.chip:hover { background: var(--bg); border-color: var(--border-strong); }
.chip.selected { background: var(--accent-soft); color: var(--accent-text); border-color: rgba(94,106,210,.3); }
.chip svg { width: 11px; height: 11px; }
.chip-x { color: var(--text-muted); cursor: pointer; }
.chip-x:hover { color: var(--red); }

/* Choice card (request type, importer type) */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.choice {
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  cursor: pointer;
  background: var(--bg);
  transition: all .12s;
  position: relative;
}
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(94,106,210,.12); }
.choice-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--bg-muted);
  display: grid; place-items: center;
  margin-bottom: 10px;
}
.choice-icon svg { width: 16px; height: 16px; color: var(--text-secondary); }
.choice.selected .choice-icon { background: rgba(94,106,210,.18); }
.choice.selected .choice-icon svg { color: var(--accent); }
.choice-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.choice-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

.choice-check {
  position: absolute;
  top: 10px;
  inset-inline-start: 12px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  display: grid; place-items: center;
  opacity: 0; transform: scale(.7);
  transition: all .15s;
}
.choice.selected .choice-check { opacity: 1; transform: scale(1); }
.choice-check svg { width: 11px; height: 11px; color: #fff; }

/* Empty state */
.empty {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
}
.empty-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.empty-desc { font-size: 13px; }

/* Layout helpers */
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }

.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
.mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }

.text-muted { color: var(--text-muted); }
.text-secondary { color: var(--text-secondary); }
.text-sm { font-size: 12.5px; }
.text-xs { font-size: 11.5px; }
.text-lg { font-size: 16px; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }

.divider-h { height: 1px; background: var(--divider); margin: 12px 0; }

/* Detail layout */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 18px;
  align-items: start;
}
@media (max-width: 1100px) {
  .detail-grid { grid-template-columns: 1fr; }
}

.kv-grid {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 6px 14px;
}
.kv-grid dt { font-size: 12.5px; color: var(--text-muted); }
.kv-grid dd { margin: 0; font-size: 13px; color: var(--text); }

/* Tabs (full tab bar on detail page) */
.subnav {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--divider);
  margin-bottom: 16px;
  overflow-x: auto;
}
.subnav-tab {
  padding: 10px 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.subnav-tab:hover { color: var(--text); }
.subnav-tab[aria-selected="true"] { color: var(--accent-text); border-color: var(--accent); }
.subnav-tab .tab-count { background: var(--bg-muted); }

/* Toast / notification (success/error) */
.toast-wrap { position: fixed; top: 16px; inset-inline-start: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 280px;
  animation: toastIn .25s cubic-bezier(.2,.7,.2,1);
  border-inline-start: 3px solid var(--accent);
}
.toast.success { border-inline-start-color: var(--green); }
.toast.error { border-inline-start-color: var(--red); }
@keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.toast-text { font-size: 13px; flex: 1; }

/* File upload box */
.upload {
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-md);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-subtle);
  cursor: pointer;
  transition: all .12s;
}
.upload:hover { border-color: var(--accent); background: var(--accent-soft); }
.upload-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--bg-muted); display: grid; place-items: center; flex-shrink: 0; color: var(--text-secondary); }
.upload-icon svg { width: 16px; height: 16px; }
.upload-text { flex: 1; }
.upload-title { font-size: 13px; font-weight: 500; color: var(--text); }
.upload-hint { font-size: 12px; color: var(--text-muted); }

.file-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg);
  margin-bottom: 6px;
}
.file-icon {
  width: 30px; height: 30px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.file-icon svg { width: 15px; height: 15px; }
.file-name { font-size: 13px; font-weight: 500; color: var(--text); }
.file-meta { font-size: 11.5px; color: var(--text-muted); }
.file-actions { display: inline-flex; gap: 4px; margin-inline-start: auto; }

/* Timeline */
.timeline { position: relative; padding-inline-start: 18px; }
.timeline::before {
  content: '';
  position: absolute;
  inset-block: 4px;
  inset-inline-start: 6px;
  width: 2px;
  background: var(--divider);
}
.tl-item { position: relative; padding-bottom: 14px; }
.tl-dot {
  position: absolute;
  inset-inline-start: -18px;
  top: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--border-strong);
}
.tl-item.current .tl-dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tl-item.done .tl-dot { background: var(--green); border-color: var(--green); }
.tl-title { font-size: 13px; font-weight: 500; color: var(--text); }
.tl-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.tl-comment { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.55; }

/* External user — top header (no sidebar) */
.ext-header {
  background: var(--bg);
  border-bottom: 1px solid var(--divider);
  padding: 0 28px;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 14px;
}
.ext-header .brand { display: flex; align-items: center; gap: 10px; }
.ext-nav { display: inline-flex; gap: 2px; margin-inline-start: 24px; }
.ext-nav-item {
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 6px;
  color: var(--text-secondary);
  font-weight: 500;
  cursor: pointer;
}
.ext-nav-item:hover { background: var(--bg-muted); color: var(--text); }
.ext-nav-item[aria-current="true"] { color: var(--accent-text); background: var(--accent-soft); }

/* Decision action bar (sticky) */
.action-bar {
  position: sticky;
  bottom: 0;
  margin-top: 18px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-md);
  z-index: 5;
}

/* Hero / cta for empty drafts */
.hero-card {
  background: linear-gradient(140deg, #f4f5ff 0%, #f6f0fb 100%);
  border: 1px solid #e3e5fa;
  padding: 28px;
  border-radius: var(--r-lg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

/* Help text small */
.helper { font-size: 12px; color: var(--text-muted); }

/* Animation for entering page content */
.page-enter { animation: pageIn .22s cubic-bezier(.2,.7,.2,1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.08); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.16); }
::-webkit-scrollbar-track { background: transparent; }

    return {
      id: `DOC-${reqIdx + 1}-${i + 1}`,
      type_code: dt.code,
      label: dt.label,
      required: dt.required,
      file_name: status !== 'not_attached' ? `${dt.code.replace(/_/g,'-')}.pdf` : null,
      size_kb: status !== 'not_attached' ? randInt(120, 4800) : null,
      status,
      uploaded_at: status !== 'not_attached' ? daysAgo(randInt(1, 18)) : null,
      status_at: ['approved','rejected'].includes(status) ? daysAgo(randInt(1, 12)) : null,
      comment: status === 'rejected' ? 'יש להגיש מסמך מעודכן וחתום' : null,
    };
  });
}

function buildApprovals(reqIdx, status) {
  const list = [];
  const order = ['economist', 'garage', 'import', 'department'];
  const stages = {
    in_review:       1,
    awaiting_data:   1,
    rejected:        1,
    pending_manager: 3,
    pending_issue:   4,
    approved:        4,
  };
  const stage = stages[status] || 0;
  order.slice(0, stage).forEach((code, i) => {
    const ap = APPROVAL_TYPES.find(a => a.code === code);
    list.push({
      id: `AP-${reqIdx + 1}-${i + 1}`,
      code,
      label: ap.label,
      role: ap.role,
      user: USERS[ap.role].name,
      date: daysAgo(stages[status] === 4 ? randInt(1, 5) : randInt(1, 8)),
    });
  });
  return list;
}

function buildLog(reqIdx, status, createdDaysAgo) {
  const path = ['draft', 'submitted', 'in_review'];
  if (status === 'awaiting_data') path.push('awaiting_data');
  if (status === 'pending_manager') path.push('pending_manager');
  if (status === 'pending_issue') path.push('pending_manager', 'pending_issue');
  if (status === 'approved') path.push('pending_manager', 'pending_issue', 'approved');
  if (status === 'rejected') path.push('awaiting_data', 'rejected');
  if (status === 'submitted') {} // just submitted

  return path.map((s, i) => ({
    status: s,
    label: REQUEST_STATUS[s].label,
    date: daysAgo(Math.max(0, -createdDaysAgo - i * 2)),
    comment: s === 'rejected' ? 'נמצאו פערים מהותיים במסמכי ההון העצמי' :
             s === 'awaiting_data' ? 'נדרשת השלמת מסמכי הון עצמי + הסכם תחזוקה מעודכן' :
             s === 'in_review' ? 'הבקשה הועברה לבחינה של גורמי המקצוע' :
             null,
  }));
}

  { id: 'PMT-2025100061', company: 'נווה מוטורס בע״מ',         company_id: '516789012', importer_type: 'indirect', importer_type_label: 'יבואן עקיף', applicant: APPLICANTS[11], created_at: daysAgo(220), expires_at: daysFromNow(45), products: [{ id: 'P1', code: 'mercedes', label: 'מרצדס', classifications: ['M1','M2','N1'] }, { id: 'P2', code: 'mini', label: 'מיני', classifications: ['M1'] }], status: 'active' },
  { id: 'PMT-2024100098', company: 'מובילי דרך בע״מ',          company_id: '515678901', importer_type: 'direct', importer_type_label: 'יבואן ישיר', applicant: APPLICANTS[5], created_at: daysAgo(310), expires_at: daysFromNow(155), products: [{ id: 'P1', code: 'skoda', label: 'סקודה', classifications: ['M1','M2'] }], status: 'active' },

];

// Distinct importers list
const IMPORTERS = COMPANIES.map((c, i) => ({

  { user: 'דליה אברהמי',  role: 'department_manager', action: 'אישרה את',                target: 'BCS-2026091', when: '3 שעות' },

  <script type="text/babel" data-presets="env,react">
// components.jsx — shared UI components

const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;

// ---------- Status badge ----------
function StatusBadge({ status, size }) {
  const { statusBadge } = window.AppData;
  const s = statusBadge(status);
  return (
    <span className={`badge badge-${s.badge}`}>
      <span className="badge-dot" />
      {s.label}
    </span>
  );
}

function Badge({ tone = 'gray', children, dot = false, icon }) {
  return (
    <span className={`badge badge-${tone}`}>
      {dot && <span className="badge-dot" />}
      {icon}
      {children}
    </span>
  );
}

// ---------- Button ----------
function Button({ variant = 'secondary', size, icon, iconEnd, children, onClick, disabled, type = 'button', className = '', title }) {
  return (
    <button
      type={type}
      className={`btn btn-${variant} ${size ? 'btn-' + size : ''} ${className}`}
      onClick={onClick}
      disabled={disabled}
      title={title}
    >
      {icon}
      {children}
      {iconEnd}
    </button>
  );
}

// ---------- Field ----------
function Field({ label, required, hint, error, children, span = 6 }) {
  return (
    <div className={`field col-${span}`}>
      {label && (
        <label className="field-label">
          {label}{required && <span className="req">*</span>}
        </label>
      )}
      {children}
      {hint && !error && <div className="field-hint">{hint}</div>}
      {error && <div className="field-error">{error}</div>}
    </div>
  );
}

function Input({ value, onChange, placeholder, type = 'text', disabled, readOnly, error, dir = 'rtl', ...rest }) {
  return (
    <input
      type={type}
      className={`input ${error ? 'has-error' : ''}`}
      value={value || ''}
      onChange={e => onChange && onChange(e.target.value)}
      placeholder={placeholder}
      disabled={disabled}
      readOnly={readOnly}
      dir={dir}
      {...rest}
    />
  );
}

function Select({ value, onChange, options = [], placeholder, disabled }) {
  return (
    <select
      className="select"
      value={value || ''}
      onChange={e => onChange && onChange(e.target.value)}
      disabled={disabled}
    >
      {placeholder && <option value="" disabled>{placeholder}</option>}
      {options.map((opt) => {
        const o = typeof opt === 'string' ? { value: opt, label: opt } : opt;
        return <option key={o.value} value={o.value}>{o.label}</option>;
      })}
    </select>
  );
}

function Textarea({ value, onChange, placeholder, rows = 3, disabled }) {
  return (
    <textarea
      className="textarea"
      value={value || ''}
      onChange={e => onChange && onChange(e.target.value)}
      placeholder={placeholder}
      rows={rows}
      disabled={disabled}
    />
  );
}

// ---------- Modal ----------
function Modal({ title, children, onClose, footer, width }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ width }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3 className="modal-title">{title}</h3>
          <button className="modal-close" onClick={onClose}>
            <Icons.X size={16} />
          </button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ---------- Stepper ----------
function Stepper({ steps, current }) {
  return (
    <div className="stepper">
      {steps.map((s, i) => (
        <React.Fragment key={i}>
          <div className={`step ${i === current ? 'active' : ''} ${i < current ? 'done' : ''}`}>
            <span className="step-num">{i < current ? <Icons.Check size={11} /> : i + 1}</span>
            <span>{s}</span>
          </div>
          {i < steps.length - 1 && <div className="step-sep" />}
        </React.Fragment>
      ))}
    </div>
  );
}

// ---------- Tabs ----------
function Tabs({ tabs, active, onChange }) {
  return (
    <div className="tabs">
      {tabs.map(t => (
        <button
          key={t.id}
          className="tab"
          aria-selected={active === t.id}
          onClick={() => onChange(t.id)}
        >
          {t.label}
          {t.count !== undefined && <span className="tab-count">{t.count}</span>}
        </button>
      ))}
    </div>
  );
}

function SubnavTabs({ tabs, active, onChange }) {
  return (
    <div className="subnav">
      {tabs.map(t => (
        <button
          key={t.id}
          className="subnav-tab"
          aria-selected={active === t.id}
          onClick={() => onChange(t.id)}
        >
          {t.icon}
          {t.label}
          {t.count !== undefined && <span className="tab-count">{t.count}</span>}
        </button>
      ))}
    </div>
  );
}

// ---------- Card ----------
function Card({ title, subtitle, headerEnd, children, flush, footer, className = '' }) {
  return (
    <div className={`card ${className}`}>
      {(title || headerEnd) && (
        <div className="card-header">
          <div>
            {title && <h3 className="card-title">{title}</h3>}
            {subtitle && <div className="card-subtitle">{subtitle}</div>}
          </div>
          {headerEnd}
        </div>
      )}
      <div className={`card-body ${flush ? 'flush' : ''}`}>{children}</div>
      {footer}
    </div>
  );
}

// ---------- Stat tile ----------
function Stat({ label, value, delta, deltaDir, icon, iconTone = 'blue' }) {
  return (
    <div className="stat">
      <div className="stat-label">{label}</div>
      <div className="stat-value">
        <span className="stat-num">{value}</span>
        {delta && (
          <span className={`stat-delta ${deltaDir || ''}`}>
            {deltaDir === 'up' ? '↑' : deltaDir === 'down' ? '↓' : ''} {delta}
          </span>
        )}
      </div>
      {icon && <div className={`stat-icon ${iconTone}`}>{icon}</div>}
    </div>
  );
}

// ---------- Pagination ----------
function Pager({ page, pages, onChange, total, pageSize, label = 'רשומות' }) {
  const start = (page - 1) * pageSize + 1;
  const end = Math.min(page * pageSize, total);
  return (
    <div className="tbl-footer">
      <div>{total > 0 ? `${start}-${end} מתוך ${total} ${label}` : `אין ${label}`}</div>
      <div className="tbl-pager">
        <button disabled={page <= 1} onClick={() => onChange(page - 1)}><Icons.ChevronRight size={11} /></button>
        {Array.from({ length: pages }, (_, i) => (
          <button key={i} aria-current={page === i + 1} onClick={() => onChange(i + 1)}>{i + 1}</button>
        ))}
        <button disabled={page >= pages} onClick={() => onChange(page + 1)}><Icons.ChevronLeft size={11} /></button>
      </div>
    </div>
  );
}

// ---------- Donut chart (SVG) ----------
function Donut({ data, size = 130 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const radius = size / 2 - 12;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  const segs = data.map((d, i) => {
    const len = (d.value / total) * circumference;
    const dash = `${len} ${circumference - len}`;
    const dashOffset = -offset;
    offset += len;
    return { dash, dashOffset, color: d.color || '#5e6ad2', key: i };
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={cx} cy={cy} r={radius} fill="none" stroke="#f0f0f2" strokeWidth="14" />
      {segs.map(s => (
        <circle
          key={s.key}
          cx={cx} cy={cy} r={radius}
          fill="none"
          stroke={s.color}
          strokeWidth="14"
          strokeDasharray={s.dash}
          strokeDashoffset={s.dashOffset}
          style={{ transition: 'stroke-dashoffset .4s' }}
        />
      ))}
      <text
        x={cx} y={cy + 5}
        textAnchor="middle"
        fontSize="20"
        fontWeight="600"
        fill="#18181b"
        style={{ transform: 'rotate(90deg)', transformOrigin: 'center' }}
      >{total}</text>
    </svg>
  );
}

// ---------- Bar chart row ----------
function BarRow({ label, value, max, color = 'var(--accent)' }) {
  const pct = max > 0 ? (value / max) * 100 : 0;
  return (
    <div className="bar-row">
      <div className="bar-label">{label}</div>
      <div className="bar-track">
        <div className="bar-fill" style={{ width: `${pct}%`, background: color }} />
      </div>
      <div className="bar-value">{value}</div>
    </div>
  );
}

// ---------- Toast ----------
const ToastContext = createContext(null);

function ToastProvider({ children }) {
  const [items, setItems] = useState([]);
  const show = (text, type = 'info') => {
    const id = Math.random();
    setItems(s => [...s, { id, text, type }]);
    setTimeout(() => setItems(s => s.filter(x => x.id !== id)), 3200);
  };
  return (
    <ToastContext.Provider value={{ show }}>
      {children}
      <div className="toast-wrap">
        {items.map(i => (
          <div key={i.id} className={`toast ${i.type}`}>
            {i.type === 'success' && <Icons.CheckCircle size={16} color="var(--green)" />}
            {i.type === 'error' && <Icons.XCircle size={16} color="var(--red)" />}
            {i.type === 'info' && <Icons.Info size={16} color="var(--accent)" />}
            <div className="toast-text">{i.text}</div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

function useToast() { return useContext(ToastContext); }

// ---------- File row ----------
function FileRow({ file, onRemove, onPreview, status }) {
  return (
    <div className="file-row">
      <div className="file-icon"><Icons.FileText size={15} /></div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="file-name" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</div>
        <div className="file-meta">{file.size}</div>
      </div>
      {status && <Badge tone={window.AppData.DOC_STATUS[status]?.badge || 'gray'} dot>{window.AppData.DOC_STATUS[status]?.label}</Badge>}
      <div className="file-actions">
        {onPreview && <Button variant="ghost" size="sm" icon={<Icons.Eye size={14}/>} onClick={onPreview} />}
        {onRemove && <Button variant="ghost" size="sm" icon={<Icons.Trash size={14}/>} onClick={onRemove} />}
      </div>
    </div>
  );
}

// ---------- Avatar ----------
function Avatar({ user, size = 28 }) {
  const u = typeof user === 'string' ? { name: user, initials: user.split(' ').slice(0, 2).map(s => s[0]).join(''), color: '#5e6ad2' } : user;
  return (
    <div
      className="role-avatar"
      style={{ width: size, height: size, background: `linear-gradient(135deg, ${u.color}, ${u.color}aa)`, fontSize: size * 0.4 }}
    >{u.initials || u.name?.[0]}</div>
  );
}

// expose
Object.assign(window, {
  StatusBadge, Badge, Button, Field, Input, Select, Textarea,
  Modal, Stepper, Tabs, SubnavTabs, Card, Stat, Pager,
  Donut, BarRow, ToastProvider, useToast, FileRow, Avatar,
  ToastContext,
});
  </script>
  <script type="text/babel" data-presets="env,react">
// dashboard.jsx — Internal management dashboard

const { useState: dUseState, useMemo: dUseMemo } = React;

function Dashboard({ onNavigate }) {

  const pendingStatuses = ['submitted','in_review','awaiting_data','pending_manager','pending_issue'];

  <script type="text/babel" data-presets="env,react">
// requests-list.jsx — list of requests (internal + external variants)

function RequestsList({ context, currentUser, onNavigate }) {
  const { REQUESTS, REQUEST_STATUS, REQUEST_TYPES, IMPORTER_TYPES, fmtDate, fmtDateTime, statusBadge } = window.AppData;

  const [statusFilter, setStatusFilter] = React.useState('all');
  const [typeFilter, setTypeFilter] = React.useState('all');
  const [search, setSearch] = React.useState('');
  const [page, setPage] = React.useState(1);
  const pageSize = 10;

  const isExternal = context === 'external';

  // For external — only show current user's requests (simulate by filtering for first 3 or so)
  let baseList = REQUESTS;
  if (isExternal) {
    // user is representative — only their own (first company)
    baseList = REQUESTS.filter(r => r.applicant.email === currentUser.applicant?.email || r.company === currentUser.company);
  }

  // Counts for tabs
  const tabs = [
    { id: 'all',  label: 'הכל',                 count: baseList.length },
    { id: 'open', label: 'בטיפול',              count: baseList.filter(r => !['approved','rejected','draft'].includes(r.status)).length },
    { id: 'draft',label: 'טיוטות',              count: baseList.filter(r => r.status === 'draft').length },
    { id: 'approved', label: 'מאושרות',         count: baseList.filter(r => r.status === 'approved').length },
    { id: 'rejected', label: 'נדחו',           count: baseList.filter(r => r.status === 'rejected').length },
  ];

  const filtered = baseList.filter(r => {
    if (statusFilter !== 'all') {
      if (statusFilter === 'open' && ['approved','rejected','draft'].includes(r.status)) return false;
      if (statusFilter === 'draft' && r.status !== 'draft') return false;
      if (statusFilter === 'approved' && r.status !== 'approved') return false;
      if (statusFilter === 'rejected' && r.status !== 'rejected') return false;
    }
    if (typeFilter !== 'all' && r.request_type !== typeFilter) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!r.id.toLowerCase().includes(q) && !r.company.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageItems = filtered.slice((page - 1) * pageSize, page * pageSize);

  return (
    <div className="workspace page-enter">
      <div className="page-header">
        <div>
          <h1 className="page-title">{isExternal ? 'הבקשות שלי' : 'בקשות ממתינות לטיפול'}</h1>
          <div className="page-subtitle">
            {isExternal
              ? 'בקשות לרישיון יבואן שהגשת או שמורות כטיוטה'
              : 'כל הבקשות במערכת — סנן לפי סטטוס וסוג'}
          </div>
        </div>
        <div className="row gap-2">
          {isExternal && (
            <Button variant="primary" icon={<Icons.Plus size={14}/>} onClick={() => onNavigate('new-request')}>
              בקשה חדשה
            </Button>
          )}
          {!isExternal && (
            <>
              <Button variant="ghost" icon={<Icons.Filter size={14}/>}>סינון מתקדם</Button>
              <Button variant="secondary" icon={<Icons.Download size={14}/>}>ייצוא</Button>
            </>
          )}
        </div>
      </div>

      <div className="card mb-4" style={{ overflow: 'visible' }}>
        <div className="tbl-toolbar">
          <Tabs tabs={tabs} active={statusFilter} onChange={(id) => { setStatusFilter(id); setPage(1); }} />
          <div style={{ flex: 1 }} />
          <div className="topbar-search" style={{ width: 240 }}>
            <input
              placeholder="חיפוש לפי מספר בקשה או חברה..."
              value={search}
              onChange={e => { setSearch(e.target.value); setPage(1); }}
            />
            <Icons.Search size={13} />
          </div>
          <select
            className="select"
            style={{ width: 'auto', padding: '6px 26px 6px 12px', fontSize: 12.5 }}
            value={typeFilter}
            onChange={e => { setTypeFilter(e.target.value); setPage(1); }}
          >
            <option value="all">כל סוגי הבקשה</option>
            {REQUEST_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th style={{ width: 130 }}>מספר בקשה</th>
              <th>חברה</th>
              <th>סוג בקשה</th>
              <th>סוג יבואן</th>
              <th>מגיש</th>
              <th>תוצרים</th>
              <th>מסמכים</th>
              <th>סטטוס</th>
              <th>עודכן</th>
              {!isExternal && <th style={{ width: 36 }}></th>}
            </tr>
          </thead>
          <tbody>
            {pageItems.map(r => {
              const docsApproved = r.documents.filter(d => d.status === 'approved').length;
              const docsAttached = r.documents.filter(d => d.status !== 'not_attached').length;
              return (
                <tr key={r.id} className="clickable" onClick={() => onNavigate(`request:${r.id}`)}>
                  <td className="cell-id"><span className="mono">{r.id}</span></td>
                  <td>
                    <div style={{ fontWeight: 500 }}>{r.company}</div>
                    <div className="text-xs text-muted">{r.company_id}</div>
                  </td>
                  <td className="muted">{r.request_type_label}</td>
                  <td><Badge tone="gray">{r.importer_type_label}</Badge></td>
                  <td>
                    <div>{r.applicant.first} {r.applicant.last}</div>
                    <div className="text-xs text-muted">{r.applicant.email}</div>
                  </td>
                  <td className="num">{r.products.length || <span className="text-muted">—</span>}</td>
                  <td className="num">
                    <span className="text-secondary">{docsApproved}</span>
                    <span className="text-muted">/{r.documents.length}</span>
                  </td>
                  <td><StatusBadge status={r.status} /></td>
                  <td className="muted text-sm">{fmtDate(r.updated_at)}</td>
                  {!isExternal && (
                    <td>
                      <Icons.ChevronLeft size={14} color="var(--text-muted)" />
                    </td>
                  )}
                </tr>
              );
            })}
            {pageItems.length === 0 && (
              <tr><td colSpan={isExternal ? 9 : 10}>
                <div className="empty">
                  <div className="empty-title">לא נמצאו בקשות</div>
                  <div className="empty-desc">נסה לשנות את הסינונים או מילת החיפוש</div>
                </div>
              </td></tr>
            )}
          </tbody>
        </table>

        <Pager
          page={page}
          pages={pages}
          onChange={setPage}
          total={filtered.length}
          pageSize={pageSize}
          label="בקשות"
        />
      </div>
    </div>
  );
}

window.RequestsList = RequestsList;
  </script>
  <script type="text/babel" data-presets="env,react">
// request-detail.jsx — request review (internal) + view (external)

function RequestDetail({ requestId, context, currentUser, onNavigate, onUpdateRequest }) {
  const data = window.AppData;
  const { REQUESTS, REQUEST_STATUS, PRODUCTS, CLASSIFICATIONS, DOC_STATUS, USERS, fmtDate, fmtDateTime } = data;

  const [request, setRequest] = React.useState(() => REQUESTS.find(r => r.id === requestId));
  const [tab, setTab] = React.useState('data');
  const [showApproveModal, setShowApproveModal] = React.useState(false);
  const [showRejectModal, setShowRejectModal] = React.useState(false);
  const [showReturnModal, setShowReturnModal] = React.useState(false);
  const [showApprovalDialog, setShowApprovalDialog] = React.useState(null);
  const [showProductModal, setShowProductModal] = React.useState(null);
  const [actionComment, setActionComment] = React.useState('');
  const toast = useToast();

  if (!request) {
    return (
      <div className="workspace">
        <div className="empty">
          <div className="empty-title">בקשה לא נמצאה</div>
          <Button variant="primary" onClick={() => onNavigate('requests')}>חזרה לרשימה</Button>
        </div>
      </div>
    );
  }

  const isExternal = context === 'external';
  const isInternal = !isExternal;
  const role = currentUser.role;

  // Determine what actions current role can take
  const isImportManager = role === 'import_manager';
  const isEconomist = role === 'economist';
  const isGarage = role === 'garage_department';
  const isDeptManager = role === 'department_manager';
  const canDecide = isImportManager && ['in_review','awaiting_data'].includes(request.status);
  const canFinalApprove = isDeptManager && request.status === 'pending_manager';
  const canApproveDocs = isImportManager || isEconomist || isGarage;

  // ============================================================
  // Update helpers
  // ============================================================

  function updateRequest(patch) {
    const next = { ...request, ...patch, updated_at: new Date().toISOString() };
    setRequest(next);
    onUpdateRequest && onUpdateRequest(next);
  }

  function setDocStatus(docId, status, comment) {
    const docs = request.documents.map(d =>
      d.id === docId
        ? { ...d, status, comment: comment || d.comment, status_at: new Date().toISOString() }
        : d
    );
    updateRequest({ documents: docs });
    toast.show(`סטטוס המסמך עודכן: ${DOC_STATUS[status].label}`, 'success');
  }

  function setProductStatus(productId, status) {
    const products = request.products.map(p =>
      p.id === productId ? { ...p, status } : p
    );
    updateRequest({ products });
  }

  function updateStatus(newStatus, comment) {
    const log = [
      ...request.log,
      { status: newStatus, label: REQUEST_STATUS[newStatus].label, date: new Date().toISOString(), comment: comment || null },
    ];
    updateRequest({ status: newStatus, log });
  }

  function approveAsRole(approvalCode, label) {
    const approval = {
      id: `AP-${Date.now()}`,
      code: approvalCode,
      label,
      role,
      user: USERS[role].name,
      date: new Date().toISOString(),
    };
    updateRequest({ approvals: [...request.approvals, approval] });
    toast.show(`האישור נרשם: ${label}`, 'success');
    setShowApprovalDialog(null);
  }

  function handleSendForCompletion() {
    updateStatus('awaiting_data', actionComment);
    setShowReturnModal(false);
    setActionComment('');
    toast.show('הבקשה הוחזרה למייצג להשלמת נתונים', 'success');
  }

  function handleReject() {
    updateStatus('rejected', actionComment);
    setShowRejectModal(false);
    setActionComment('');
    toast.show('הבקשה נדחתה', 'error');
  }

  function handleApprove() {
    if (canDecide) {
      updateStatus('pending_manager', actionComment || 'הועברה לאישור מנהל אגף');
      approveAsRole('import', 'אישור תחום יבוא');
    } else if (canFinalApprove) {
      updateStatus('pending_issue', actionComment || 'אושר על ידי מנהל אגף');
      approveAsRole('department', 'אישור מנהל אגף');
    }
    setShowApproveModal(false);
    setActionComment('');
    toast.show('הבקשה אושרה', 'success');
  }

  function handleIssuePermit() {
    updateStatus('approved', 'הרישיון הופק ונשלח ליבואן');
    const permitId = `PMT-${String(2025900 + Math.floor(Math.random() * 100)).padStart(7,'0')}`;
    updateRequest({ permit_id: permitId });
    toast.show(`הרישיון ${permitId} הופק בהצלחה`, 'success');
  }

  // ============================================================
  // Stats
  // ============================================================
  const docsApproved = request.documents.filter(d => d.status === 'approved').length;
  const docsRejected = request.documents.filter(d => d.status === 'rejected').length;
  const docsTotal = request.documents.length;
  const productsApproved = request.products.filter(p => p.status === 'approved').length;

  const subtabs = [
    { id: 'data',     label: 'נתוני בקשה',           icon: <Icons.User size={14}/> },
    { id: 'products', label: 'תוצרים וסיווגים',       icon: <Icons.Package size={14}/>, count: request.products.length },
    { id: 'documents',label: 'מסמכים',                icon: <Icons.FileText size={14}/>, count: `${docsApproved}/${docsTotal}` },
    ...(isInternal ? [{ id: 'approvals', label: 'אישורים',  icon: <Icons.CheckCircle size={14}/>, count: request.approvals.length }] : []),
    { id: 'timeline', label: 'היסטוריה',              icon: <Icons.History size={14}/> },
    ...(isInternal ? [{ id: 'decision', label: 'החלטה והפקה', icon: <Icons.Award size={14}/> }] : []),
  ];

  // ============================================================
  return (
    <div className="workspace page-enter">
      {/* Header */}
      <div className="page-header">
        <div>
          <div className="row gap-2 mb-1">
            <button className="btn btn-ghost btn-sm" onClick={() => onNavigate(isExternal ? 'my-requests' : 'requests')}>
              <Icons.ArrowRight size={14} />
              חזרה לרשימה
            </button>
            <StatusBadge status={request.status} />
            {request.permit_id && (
              <Badge tone="indigo" dot>
                <Icons.Award size={11} />
                רישיון <span className="mono" style={{ marginInlineStart: 4 }}>{request.permit_id}</span>
              </Badge>
            )}
          </div>
          <h1 className="page-title">
            <span className="mono" style={{ background:'var(--bg-muted)', padding:'2px 8px', borderRadius:6, fontSize:18, marginInlineEnd:8 }}>{request.id}</span>
            {request.company}
          </h1>
          <div className="page-subtitle">
            {request.request_type_label} · {request.importer_type_label} · נוצרה {fmtDateTime(request.created_at)}
          </div>
        </div>
        <div className="row gap-2">
          <Button variant="ghost" icon={<Icons.Download size={14}/>}>הורד PDF</Button>
          {isInternal && <Button variant="secondary" icon={<Icons.Mail size={14}/>}>שלח תזכורת</Button>}
        </div>
      </div>

      <SubnavTabs tabs={subtabs} active={tab} onChange={setTab} />

      <div className="detail-grid">
        <div>
          {tab === 'data' && <DataTab request={request} isExternal={isExternal} updateRequest={updateRequest} />}
          {tab === 'products' && <ProductsTab request={request} isInternal={isInternal} canDecide={canDecide} setProductStatus={setProductStatus} onOpenProduct={setShowProductModal} />}
          {tab === 'documents' && <DocumentsTab request={request} isInternal={isInternal} canApproveDocs={canApproveDocs} role={role} setDocStatus={setDocStatus} />}
          {tab === 'approvals' && isInternal && <ApprovalsTab request={request} role={role} canDecide={canDecide} canFinalApprove={canFinalApprove} onApprove={setShowApprovalDialog} />}
          {tab === 'timeline' && <TimelineTab request={request} />}
          {tab === 'decision' && isInternal && (
            <DecisionTab
              request={request}
              role={role}
              canDecide={canDecide}
              canFinalApprove={canFinalApprove}
              onApprove={() => setShowApproveModal(true)}
              onReject={() => setShowRejectModal(true)}
              onReturn={() => setShowReturnModal(true)}
              onIssue={handleIssuePermit}
              onRemarkChange={(v) => updateRequest({ internal_remark: v })}
            />
          )}
        </div>

        <RequestSidebar request={request} isInternal={isInternal} />
      </div>

      {/* Action bar for internal users with decision power */}
      {isInternal && (canDecide || canFinalApprove) && tab !== 'decision' && (
        <div className="action-bar">
          <div>
            <div className="font-semibold">{canDecide ? 'הבקשה ממתינה להחלטתך' : 'נדרש אישור סופי מנהל אגף'}</div>
            <div className="text-sm text-muted">בחן את כל הסעיפים והחלט: אישור, החזרה להשלמה, או דחייה</div>
          </div>
          <div className="row gap-2">
            <Button variant="ghost" onClick={() => setShowReturnModal(true)} icon={<Icons.ArrowRight size={14}/>}>החזרה להשלמה</Button>
            <Button variant="ghost" onClick={() => setShowRejectModal(true)} icon={<Icons.XCircle size={14}/>}>דחה</Button>
            <Button variant="primary" onClick={() => setShowApproveModal(true)} icon={<Icons.CheckCircle size={14}/>}>אשר בקשה</Button>
          </div>
        </div>
      )}

      {/* Modals */}
      {showApproveModal && (
        <Modal
          title="אישור בקשה"
          onClose={() => setShowApproveModal(false)}
          footer={
            <>
              <Button variant="ghost" onClick={() => setShowApproveModal(false)}>ביטול</Button>
              <Button variant="primary" onClick={handleApprove} icon={<Icons.CheckCircle size={14}/>}>אשר ועבר הלאה</Button>
            </>
          }
        >
          <p className="text-secondary mb-3">
            {canFinalApprove
              ? 'אישור סופי של בקשה זו יעביר אותה להפקת רישיון יבואן.'
              : 'אישור בקשה זו יעביר אותה לאישור סופי של מנהל אגף.'}
          </p>
          <Field label="הערה (אופציונלי)">
            <Textarea value={actionComment} onChange={setActionComment} rows={3} placeholder="הערה פנימית להחלטה..." />
          </Field>
        </Modal>
      )}

      {showRejectModal && (
        <Modal
          title="דחיית בקשה"
          onClose={() => setShowRejectModal(false)}
          footer={
            <>
              <Button variant="ghost" onClick={() => setShowRejectModal(false)}>ביטול</Button>
              <Button variant="danger" onClick={handleReject} icon={<Icons.XCircle size={14}/>}>אישור דחייה</Button>
            </>
          }
        >
          <div className="mb-3" style={{ padding:12, background:'var(--red-soft)', color:'var(--red)', borderRadius:8, fontSize:13 }}>
            <Icons.AlertTriangle size={14} style={{ verticalAlign:-2, marginInlineEnd:6 }}/>
            דחיית הבקשה היא פעולה סופית. המייצג יקבל הודעה אוטומטית במייל.
          </div>
          <Field label="סיבת הדחייה" required>
            <Textarea value={actionComment} onChange={setActionComment} rows={4} placeholder="פרט את הסיבה לדחיית הבקשה..." />
          </Field>
        </Modal>
      )}

      {showReturnModal && (
        <Modal
          title="החזרה להשלמת נתונים/מסמכים"
          onClose={() => setShowReturnModal(false)}
          footer={
            <>
              <Button variant="ghost" onClick={() => setShowReturnModal(false)}>ביטול</Button>
              <Button variant="primary" onClick={handleSendForCompletion} icon={<Icons.Send size={14}/>}>שלח למייצג</Button>
            </>
          }
        >
          <p className="text-secondary mb-3">
            הבקשה תוחזר למייצג להשלמת המסמכים/נתונים החסרים. המייצג יקבל הודעה במייל.
          </p>
          <Field label="פירוט מה נדרש להשלים" required>
            <Textarea value={actionComment} onChange={setActionComment} rows={4} placeholder="פרט אילו מסמכים או שדות נדרשים להשלמה..." />
          </Field>
        </Modal>
      )}

      {showApprovalDialog && (
        <Modal
          title={`רישום ${showApprovalDialog.label}`}
          onClose={() => setShowApprovalDialog(null)}
          footer={
            <>
              <Button variant="ghost" onClick={() => setShowApprovalDialog(null)}>ביטול</Button>
              <Button variant="success" onClick={() => approveAsRole(showApprovalDialog.code, showApprovalDialog.label)} icon={<Icons.CheckCircle size={14}/>}>אשר</Button>
            </>
          }
        >
          <p className="text-secondary mb-3">
            על ידי לחיצה על "אשר", תרשום אישור רשמי בבקשה זו.
          </p>
          <Field label="הערה (אופציונלי)">
            <Textarea rows={3} placeholder="הוסף הערה..." />
          </Field>
        </Modal>
      )}

      {showProductModal && (
        <Modal
          title={`עדכון תוצר: ${showProductModal.label}`}
          onClose={() => setShowProductModal(null)}
          width="640px"
        >
          <ProductReviewView product={showProductModal} canDecide={canDecide} setProductStatus={(s) => { setProductStatus(showProductModal.id, s); setShowProductModal(null); }} />
        </Modal>
      )}
    </div>
  );
}

      <div className="form-section">

            <div className="empty"><div className="empty-desc">טרם נרשמו אישורים</div></div>
          ) : (
            request.approvals.map((ap, i) => {
              const u = USERS[ap.role] || { color: '#5e6ad2', initials: '?', name: ap.user };
              return (
                <div key={ap.id} style={{ padding: '12px 18px', borderBottom: i < request.approvals.length-1 ? '1px solid var(--divider)' : 'none' }}>
                  <div className="row gap-3">
                    <Avatar user={u} size={32} />
                    <div style={{ flex: 1 }}>
                      <div className="row between">
                        <div>
                          <div style={{ fontWeight: 500 }}>{ap.label}</div>
                          <div className="text-xs text-muted">{ap.user}</div>
                        </div>
                        <div className="text-xs text-muted">{fmtDateTime(ap.date)}</div>
                      </div>
                    </div>
                    <Badge tone="green" dot icon={<Icons.CheckCircle size={11}/>}>אושר</Badge>
                  </div>
                </div>

            })

      </div>

      {myAvailable.length > 0 && (
        <div className="form-section">
          <div className="form-section-header">
            <h3 className="form-section-title">אישורים שאתה רשאי לרשום</h3>
          </div>
          <div className="card-body">
            {myAvailable.map(a => (
              <div key={a.code} className="row between" style={{ padding: '10px 0', borderBottom: '1px solid var(--divider)' }}>
                <div>
                  <div className="font-semibold">{a.label}</div>
                  <div className="text-xs text-muted">דרוש לקבלת אישור סופי לרישיון</div>

              </div>

          </div>
        </div>
      )}
    </>

}

    <>
      <div className="form-section">
        <div className="form-section-header">
          <h3 className="form-section-title">סיכום הבקשה לקראת החלטה</h3>
        </div>
        <div className="card-body">
          <div className="grid-2">
            <div className="row between" style={{ padding:'10px 12px', background:'var(--bg-subtle)', borderRadius:8 }}>
              <span className="text-secondary">מסמכים מאושרים</span>
              <Badge tone={allDocsOk ? 'green' : 'amber'} dot>
                {request.documents.filter(d => d.status === 'approved').length} / {request.documents.length}
              </Badge>
            </div>

// submission-wizard.jsx — multi-step request submission flow (external)

function SubmissionWizard({ onComplete, onCancel, currentUser }) {
  const data = window.AppData;
  const { REQUEST_TYPES, IMPORTER_TYPES, ENTITY_TYPES, PRODUCTS, CLASSIFICATIONS, DOC_TYPES, fmtDate } = data;
  const toast = useToast();

  const [step, setStep] = React.useState(0);
  const [form, setForm] = React.useState({
    requestType: '',
    importerType: '',
    entityType: 'company',
    applicantFirst: 'דנה',
    applicantLast: 'ארד',
    applicantId: '312987654',
    applicantEmail: 'dana@autotrading.co.il',
    applicantPhone: '054-1234567',
    companyName: 'אוטו טריידינג בע״מ',
    companyId: '514567823',
    products: [],
    agents: { primary: '', secondary: '' },
    docs: {},
    remark: '',
    saving: false,
  });

  function update(patch) { setForm(f => ({ ...f, ...patch })); }

  const steps = ['סוג בקשה', 'פרטי מבקש', 'תוצרים וסיווגים', 'מסמכים', 'סקירה והגשה'];
  // Indirect adds an "agents" step before products
  const showAgents = form.importerType === 'indirect';
  const skipProducts = form.importerType === 'small';
  const actualSteps = showAgents ? ['סוג בקשה', 'פרטי מבקש', 'סוכנים', 'תוצרים וסיווגים', 'מסמכים', 'סקירה והגשה'] : steps;
  if (skipProducts) {
    // remove products step
    const filt = actualSteps.filter(s => s !== 'תוצרים וסיווגים');
    while (actualSteps.length > filt.length) actualSteps.pop();
    filt.forEach((s, i) => actualSteps[i] = s);
  }

  function next() { setStep(s => Math.min(actualSteps.length - 1, s + 1)); }
  function prev() { setStep(s => Math.max(0, s - 1)); }

  function canProceed() {
    const s = actualSteps[step];
    if (s === 'סוג בקשה') return form.requestType && form.importerType;
    if (s === 'פרטי מבקש') return form.applicantFirst && form.applicantLast && form.applicantId && form.applicantEmail && form.companyName && form.companyId;
    if (s === 'סוכנים') return form.agents.primary;
    if (s === 'תוצרים וסיווגים') return form.products.length > 0 && form.products.every(p => p.code && p.classifications.length > 0);
    if (s === 'מסמכים') {
      const required = DOC_TYPES.filter(d => d.required);
      return required.every(d => form.docs[d.code]);
    }
    return true;
  }

  function handleSubmit() {
    update({ saving: true });
    setTimeout(() => {
      toast.show('הבקשה נקלטה בהצלחה!', 'success');
      onComplete && onComplete({ ...form });
    }, 900);
  }

  function handleSaveDraft() {
    toast.show('הטיוטה נשמרה', 'info');
  }

  const current = actualSteps[step];

  return (
    <div className="workspace narrow page-enter">
      <div className="page-header">
        <div>
          <div className="row gap-2 mb-1">
            <button className="btn btn-ghost btn-sm" onClick={onCancel}>
              <Icons.ArrowRight size={14} />
              חזרה לרשימת הבקשות
            </button>
            <Badge tone="gray" dot>טיוטה</Badge>
          </div>
          <h1 className="page-title">הגשת בקשה לרישיון יבואן</h1>
          <div className="page-subtitle">מלא את הסעיפים ועבור בין השלבים. ניתן לשמור כטיוטה ולחזור בהמשך.</div>
        </div>
        <Button variant="ghost" icon={<Icons.Save size={14}/>} onClick={handleSaveDraft}>שמור טיוטה</Button>
      </div>

      <Stepper steps={actualSteps} current={step} />

      {/* Step content */}
      {current === 'סוג בקשה' && (
        <RequestTypeStep form={form} update={update} />
      )}

      {current === 'פרטי מבקש' && (
        <ApplicantStep form={form} update={update} />
      )}

      {current === 'סוכנים' && (
        <AgentsStep form={form} update={update} />
      )}

      {current === 'תוצרים וסיווגים' && (
        <ProductsStep form={form} update={update} />
      )}

      {current === 'מסמכים' && (
        <DocumentsStep form={form} update={update} />
      )}

      {current === 'סקירה והגשה' && (
        <ReviewStep form={form} actualSteps={actualSteps} />
      )}

      <div className="action-bar">
        <Button variant="ghost" disabled={step === 0} onClick={prev} icon={<Icons.ChevronRight size={14}/>}>
          חזרה
        </Button>
        <div className="text-sm text-muted">
          שלב {step + 1} מתוך {actualSteps.length} · {current}
        </div>
        {step < actualSteps.length - 1 ? (
          <Button variant="primary" onClick={next} disabled={!canProceed()} iconEnd={<Icons.ChevronLeft size={14}/>}>
            הבא
          </Button>
        ) : (
          <Button variant="primary" onClick={handleSubmit} disabled={form.saving} icon={<Icons.Send size={14}/>}>
            {form.saving ? 'שולח...' : 'הגש בקשה'}
          </Button>
        )}
      </div>
    </div>
  );
}

              <div
                key={it.id}

                onClick={() => update({ importerType: it.id })}
              >
                <div className="choice-check"><Icons.Check size={11}/></div>
                <div className="choice-icon">{React.createElement(Icons[it.icon] || Icons.User, { size: 16 })}</div>
                <div className="choice-title">{it.label}</div>

  );
}

function ApplicantStep({ form, update }) {

  return (
    <>
      <div className="form-section">

        <div className="form-section-body">

              <div style={{ position: 'relative' }}>

              <strong>אומת ברשם החברות:</strong> אוטו טריידינג בע״מ, ח״פ 514567823, סטטוס: פעילה, רשומה מ-12/03/2018.

function ProductsStep({ form, update }) {
  const { PRODUCTS, CLASSIFICATIONS } = window.AppData;
  const [editingIdx, setEditingIdx] = React.useState(form.products.length === 0 ? 'new' : null);
  const [draft, setDraft] = React.useState({ code: '', manufacturer: '', classifications: [] });

  function addProduct() {
    setEditingIdx('new');
    setDraft({ code: '', manufacturer: '', classifications: [] });
  }
  function saveProduct() {
    const product = PRODUCTS.find(p => p.code === draft.code);
    const newP = {
      id: `P-${Date.now()}`,
      code: draft.code,
      label: product?.label || draft.code,
      manufacturer: draft.manufacturer || product?.manufacturer || '',
      classifications: draft.classifications,
    };
    if (editingIdx === 'new') {
      update({ products: [...form.products, newP] });
    } else {
      const next = [...form.products];
      next[editingIdx] = newP;
      update({ products: next });
    }
    setEditingIdx(null);
  }
  function removeProduct(i) {
    update({ products: form.products.filter((_, x) => x !== i) });
  }
  function editProduct(i) {
    setDraft(form.products[i]);
    setEditingIdx(i);
  }

  return (
    <>
      <div className="form-section">
        <div className="form-section-header">
          <div>
            <h3 className="form-section-title">תוצרים בבקשה</h3>
            <div className="form-section-sub">הוסף תוצר אחד או יותר עם הסיווגים המתאימים</div>
          </div>
          {editingIdx === null && <Button variant="primary" size="sm" icon={<Icons.Plus size={13}/>} onClick={addProduct}>הוסף תוצר</Button>}
        </div>

        <div className="card-body flush">
          {form.products.length === 0 && editingIdx !== 'new' && (
            <div className="empty">
              <Icons.Package size={28} color="var(--text-muted)" />
              <div className="empty-title" style={{ marginTop:8 }}>לא נוספו תוצרים</div>
              <div className="empty-desc">לחץ "הוסף תוצר" להתחיל</div>
            </div>
          )}

          {form.products.map((p, i) => editingIdx === i ? (
            <ProductEditor key={i} draft={draft} setDraft={setDraft} onSave={saveProduct} onCancel={() => setEditingIdx(null)} />
          ) : (
            <div key={i} style={{ padding:'14px 18px', borderBottom: '1px solid var(--divider)' }}>
              <div className="row between">
                <div className="row gap-3">
                  <div style={{ width:32, height:32, borderRadius:7, background:'var(--accent-soft)', display:'grid', placeItems:'center' }}>
                    <Icons.Package size={15} color="var(--accent)" />
                  </div>
                  <div>
                    <div style={{ fontWeight: 500 }}>{p.label}</div>
                    <div className="text-xs text-muted">{p.manufacturer}</div>
                  </div>
                </div>
                <div className="row gap-2">
                  <Button variant="ghost" size="sm" icon={<Icons.Edit size={13}/>} onClick={() => editProduct(i)} />
                  <Button variant="ghost" size="sm" icon={<Icons.Trash size={13}/>} onClick={() => removeProduct(i)} />
                </div>
              </div>
              <div className="chip-group mt-2">
                {p.classifications.map(c => <span key={c} className="chip selected">{c}</span>)}
              </div>
            </div>
