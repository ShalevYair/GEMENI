<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אגם הסוכנים</title>
  <meta name="description" content="מערכת סוכנים חכמים לניהול מחזור החיים המלא של פיתוח תוכנה — מאיסוף דרישות ועד אבטחה ופריסה." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#08080f" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="אגם הסוכנים" />
  <meta property="og:description" content="מערכת סוכנים חכמים לניהול מחזור החיים המלא של פיתוח תוכנה." />
  <meta property="og:image" content="og-preview.svg" />
  <meta property="og:locale" content="he_IL" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="home-page">

    <!-- Agents grid -->
    <section class="home-section" style="padding-top:1.5rem;">
      <div class="agents-grid">

        <a href="agent.html?id=spec-king" class="agent-card agent-active">
          <div class="agent-card-icon">👑</div>
          <h3>מלך האפיונים</h3>
          <p>הופך דרישות עסקיות לאפיון פונקציונלי מלא — מסכים, ERD ותרשימי זרימה.</p>
        </a>

        <a href="spec-viewer.html" class="agent-card agent-active">
          <div class="agent-card-icon">📋</div>
          <h3>מציג האפיונים</h3>
          <p>מציג מסמך אפיון, טבלאות, תרשימים ומסכים — טען קבצים או פתח אוטומטית ממלך האפיונים.</p>
        </a>

      </div>
    </section>

  </div>

  <!-- Chat panel -->
  <div id="home-chat-panel" class="home-chat-panel" hidden>
    <div class="home-chat-header">
      <span class="home-chat-title">💬 שאל את הסוכן</span>
      <button class="home-chat-close" onclick="closeHomeChat()" title="סגור">✕</button>
    </div>
    <div id="home-chat-api-row" class="home-chat-api-row">
      <input type="password" id="home-chat-api-input" class="home-chat-api-input" placeholder="מפתח Gemini API — AIza..." dir="ltr" autocomplete="off" />
      <button class="home-chat-api-btn" onclick="setHomeChatApiKey()">אישור</button>
    </div>
    <div id="home-chat-messages" class="home-chat-messages"></div>
    <div class="home-chat-input-row">
      <input type="text" id="home-chat-input" class="home-chat-input" placeholder="שאל שאלה על הסוכנים, SDLC, ..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendHomeChatMessage();}" />
      <button id="home-chat-send" class="home-chat-send" onclick="sendHomeChatMessage()">שלח</button>
    </div>
  </div>

  <script>
    /* ── Dark mode & font size ── */
    function toggleDarkMode(btn) {
      var isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('sdlc-dark-mode', isLight ? 'light' : 'dark');
      if (btn) btn.textContent = isLight ? '☀' : '☾';
    }
    function changeFontSize(step) {
      var cur = parseFloat(localStorage.getItem('home-font-size') || '16');
      var next = Math.max(13, Math.min(20, cur + step));
      document.documentElement.style.fontSize = next + 'px';
      localStorage.setItem('home-font-size', next);
    }

    /* ── Chat panel ── */
    var _chatApiKey = localStorage.getItem('home-chat-apikey') || '';
    var _chatHistory = [];
    var _chatOpen = false;

    var CHAT_SYSTEM = 'אתה עוזר חכם של מערכת "אגם הסוכנים" — מערכת סוכני AI לניהול מחזור חיי פיתוח תוכנה (SDLC). ' +
      'הסוכנים: ארזסטרטור (אסטרטגיה), רכזת הפרויקטים (PMO), לעשות או לקנות (Make-or-Buy), מלך האפיונים (FSD), ' +
      'מנתח המוח (Design), מלכת העיצובים (UX/UI), אלוף הפיתוחים (פיתוח), פלטפורמר (Platform), ' +
      'הבודק (QA), המאבטח (Security), הפורס (Deployment), הצופה (Monitoring), המתעד (Documentation), מפעיל הספקים (ספקים). ' +
      'ענה בעברית, בצורה ברורה וממוקדת.';

    function openHomeChat() {
      var panel = document.getElementById('home-chat-panel');
      panel.hidden = false;
      _chatOpen = true;
      var msgs = document.getElementById('home-chat-messages');
      if (msgs.children.length === 0 && _chatHistory.length > 0) {
        _chatHistory.forEach(function(m) {
          var div = document.createElement('div');
          div.className = 'home-chat-msg home-chat-msg-' + (m.role === 'user' ? 'user' : 'assistant');
          div.textContent = m.parts[0].text;
          msgs.appendChild(div);
        });
        msgs.scrollTop = msgs.scrollHeight;
      }
      if (_chatApiKey) {
        document.getElementById('home-chat-api-row').style.display = 'none';
      }
      setTimeout(function() { document.getElementById('home-chat-input').focus(); }, 50);
    }
    function closeHomeChat() {
      document.getElementById('home-chat-panel').hidden = true;
      _chatOpen = false;
    }
    function setHomeChatApiKey() {
      var val = document.getElementById('home-chat-api-input').value.trim();
      if (!val) return;
      _chatApiKey = val;
      localStorage.setItem('home-chat-apikey', val);
      document.getElementById('home-chat-api-row').style.display = 'none';
      document.getElementById('home-chat-input').focus();
    }

    function appendChatMessage(role, text) {
      var msgs = document.getElementById('home-chat-messages');
      var div = document.createElement('div');
      div.className = 'home-chat-msg home-chat-msg-' + role;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    async function sendHomeChatMessage() {
      var inputEl = document.getElementById('home-chat-input');
      var sendBtn = document.getElementById('home-chat-send');
      var text = inputEl.value.trim();
      if (!text) return;

      if (!_chatApiKey) {
        document.getElementById('home-chat-api-row').style.display = 'flex';
        document.getElementById('home-chat-api-input').focus();
        return;
      }

      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      appendChatMessage('user', text);
      var thinkingEl = appendChatMessage('assistant', '...');

      _chatHistory.push({ role: 'user', parts: [{ text: text }] });

      var body = {
        system_instruction: { parts: [{ text: CHAT_SYSTEM }] },
        contents: _chatHistory,
        generationConfig: { maxOutputTokens: 8192 }
      };

      try {
        var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(_chatApiKey);
        var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) {
          var err = await res.json().catch(function(){ return {}; });
          if (res.status === 400 || res.status === 403) { _chatApiKey = ''; localStorage.removeItem('home-chat-apikey'); document.getElementById('home-chat-api-row').style.display = 'flex'; }
          throw new Error(err.error && err.error.message ? err.error.message : 'שגיאה ' + res.status);
        }
        var data = await res.json();
        var reply = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts)
          ? data.candidates[0].content.parts.map(function(p){ return p.text; }).join('') : '';
        if (!reply) throw new Error('תגובה ריקה');
        thinkingEl.textContent = reply;
        _chatHistory.push({ role: 'model', parts: [{ text: reply }] });
      } catch(e) {
        thinkingEl.textContent = 'שגיאה: ' + e.message;
        thinkingEl.classList.add('home-chat-msg-error');
        _chatHistory.pop();
      }

      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (localStorage.getItem('sdlc-dark-mode') === 'light') {
        document.body.classList.add('light-mode');
        var btn = document.getElementById('home-mode-btn');
        if (btn) btn.textContent = '☀';
      }
      var sz = parseFloat(localStorage.getItem('home-font-size') || '16');
      if (sz !== 16) document.documentElement.style.fontSize = sz + 'px';
      if (_chatApiKey) document.getElementById('home-chat-api-row').style.display = 'none';

      // Inject שאל button into header (next to + button)
      var actionsSlot = document.getElementById('site-header-actions');
      if (actionsSlot) {
        var chatBtn = document.createElement('button');
        chatBtn.className = 'site-header-btn';
        chatBtn.title = 'שאל את הסוכן';
        chatBtn.innerHTML = '💬';
        chatBtn.onclick = openHomeChat;
        actionsSlot.appendChild(chatBtn);
      }
    });
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
