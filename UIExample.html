  <script type="text/babel" data-presets="env,react">
// permits-list.jsx — list of importer permits

function PermitsList({ context, currentUser, onNavigate }) {
  const { PERMITS, IMPORTER_TYPES, fmtDate } = window.AppData;
  const [search, setSearch] = React.useState('');
  const [statusFilter, setStatusFilter] = React.useState('all');
  const [page, setPage] = React.useState(1);
  const pageSize = 10;

  const isExternal = context === 'external';

  let baseList = PERMITS;
  if (isExternal) {
    baseList = PERMITS.filter(p => p.company === currentUser.company);
  }

  const now = Date.now();
  const expCount = baseList.filter(p => {
    const d = (new Date(p.expires_at) - now) / (1000 * 60 * 60 * 24);
    return d <= 60 && d > 0;
  }).length;

  const tabs = [
    { id: 'all',    label: 'הכל',         count: baseList.length },
    { id: 'active', label: 'פעילים',       count: baseList.filter(p => p.status === 'active').length },
    { id: 'expiring', label: 'פגי תוקף קרוב', count: expCount },
  ];

  const filtered = baseList.filter(p => {
    if (statusFilter === 'active' && p.status !== 'active') return false;
    if (statusFilter === 'expiring') {
      const d = (new Date(p.expires_at) - now) / (1000 * 60 * 60 * 24);
      if (!(d <= 60 && d > 0)) return false;
    }
    if (search && !p.id.includes(search) && !p.company.includes(search)) return false;
    return true;
  });

  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageItems = filtered.slice((page - 1) * pageSize, page * pageSize);

  return (
    <div className="workspace page-enter">
      <div className="page-header">
        <div>
          <h1 className="page-title">{isExternal ? 'הרישיונות שלי' : 'רישיונות יבואן'}</h1>
          <div className="page-subtitle">
            {isExternal ? 'הרישיונות הפעילים שלך ותוקפם' : 'כל הרישיונות שהונפקו במערכת'}
          </div>
        </div>
        <div className="row gap-2">
          <Button variant="secondary" icon={<Icons.Download size={14}/>}>ייצוא</Button>
        </div>
      </div>

      <div className="card">
        <div className="tbl-toolbar">
          <Tabs tabs={tabs} active={statusFilter} onChange={(id) => { setStatusFilter(id); setPage(1); }} />
          <div style={{ flex: 1 }} />
          <div className="topbar-search" style={{ width: 240 }}>
            <input
              placeholder="חיפוש לפי מספר רישיון או חברה..."
              value={search}
              onChange={e => { setSearch(e.target.value); setPage(1); }}
            />
            <Icons.Search size={13} />
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th style={{width: 130}}>מספר רישיון</th>
              <th>חברה</th>
              <th>סוג יבואן</th>
              <th>תוצרים</th>
              <th>הופק</th>
              <th>תוקף עד</th>
              <th>סטטוס</th>
              <th style={{width: 36}}></th>
            </tr>
          </thead>
          <tbody>
            {pageItems.map(p => {
              const days = Math.ceil((new Date(p.expires_at) - now) / (1000 * 60 * 60 * 24));
              const expiringSoon = days <= 60 && days > 0;
              const expired = days <= 0;
              return (
                <tr key={p.id} className="clickable">
                  <td className="cell-id"><span className="mono">{p.id}</span></td>
                  <td>
                    <div style={{fontWeight: 500}}>{p.company}</div>
                    <div className="text-xs text-muted">{p.company_id}</div>
                  </td>
                  <td><Badge tone="gray">{p.importer_type_label}</Badge></td>
                  <td>
                    {p.products.length === 0 ? (
                      <span className="text-muted">—</span>
                    ) : (
                      <span className="text-sm">{p.products.map(pp => pp.label).join(', ')}</span>
                    )}
                  </td>
                  <td className="muted text-sm">{fmtDate(p.created_at)}</td>
                  <td className="text-sm">{fmtDate(p.expires_at)}</td>
                  <td>
                    {expired ? (
                      <Badge tone="red" dot>פג תוקף</Badge>
                    ) : expiringSoon ? (
                      <Badge tone="amber" dot>פוג בעוד {days} ימים</Badge>
                    ) : (
                      <Badge tone="green" dot>פעיל</Badge>
                    )}
                  </td>
                  <td><Icons.ChevronLeft size={14} color="var(--text-muted)"/></td>
                </tr>
              );
            })}
            {pageItems.length === 0 && (
              <tr><td colSpan={8}>
                <div className="empty">
                  <div className="empty-title">לא נמצאו רישיונות</div>
                  <div className="empty-desc">נסה לשנות את הסינונים או מילת החיפוש</div>
                </div>
              </td></tr>
            )}
          </tbody>
        </table>

        <Pager page={page} pages={pages} onChange={setPage} total={filtered.length} pageSize={pageSize} label="רישיונות" />
      </div>
    </div>
  );
}

function ImportersList({ onNavigate }) {

  const [search, setSearch] = React.useState('');

        </div>
        <div className="row gap-2">
          <Button variant="ghost" icon={<Icons.Filter size={14}/>}>סינון</Button>
          <Button variant="secondary" icon={<Icons.Download size={14}/>}>ייצוא</Button>
        </div>
      </div>

      <div className="card">
        <div className="tbl-toolbar">
          <div className="topbar-search" style={{ width: 280 }}>
            <input
              placeholder="חיפוש לפי שם חברה או ח״פ..."
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            <Icons.Search size={13} />
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th style={{width: 110}}>מזהה</th>
              <th>שם חברה</th>
              <th>ח״פ / ע״מ</th>
              <th>סוג ישות</th>
              <th>דוא״ל</th>
              <th>טלפון</th>
              <th>רישיונות</th>
              <th>סטטוס</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(i => (
              <tr key={i.id} className="clickable">
                <td className="cell-id"><span className="mono">{i.id}</span></td>
                <td style={{fontWeight: 500}}>{i.name}</td>
                <td className="mono text-sm">{i.company_id}</td>
                <td><Badge tone="gray">{i.entity_type_label}</Badge></td>
                <td className="text-sm text-muted">{i.email}</td>
                <td className="text-sm text-muted">{i.phone}</td>
                <td className="num">{i.permits_count}</td>
                <td><Badge tone="green" dot>פעיל</Badge></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  <script type="text/babel" data-presets="env,react">
// app.jsx — main shell with role switching and routing

const { useState: aUseState, useEffect: aUseEffect, useMemo: aUseMemo } = React;

function App() {
  const { ROLES, USERS, REQUESTS } = window.AppData;

  // Persist role + page
  const [roleId, setRoleId] = React.useState(() => localStorage.getItem('kerem-role') || 'import_manager');
  const [page, setPage] = React.useState(() => localStorage.getItem('kerem-page') || 'dashboard');
  const [requestData, setRequestData] = React.useState(window.AppData.REQUESTS);
  const [roleMenuOpen, setRoleMenuOpen] = React.useState(false);

  React.useEffect(() => { localStorage.setItem('kerem-role', roleId); }, [roleId]);
  React.useEffect(() => { localStorage.setItem('kerem-page', page); }, [page]);

  const role = ROLES.find(r => r.id === roleId);
  const user = USERS[roleId];
  const isExternal = role.category === 'external';

  // For external user, force pages they can access
  React.useEffect(() => {
    if (isExternal && !['my-requests', 'my-permits', 'new-request'].includes(page) && !page.startsWith('request:')) {
      setPage('my-requests');
    }
    if (!isExternal && ['my-requests', 'my-permits', 'new-request'].includes(page)) {
      setPage('dashboard');
    }
  }, [isExternal, page]);

  function navigate(p) {
    setPage(p);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function switchRole(newRoleId) {
    setRoleId(newRoleId);
    setRoleMenuOpen(false);
    const newRole = ROLES.find(r => r.id === newRoleId);
    if (newRole.category === 'external') setPage('my-requests');
    else setPage('dashboard');
  }

  function updateRequestInList(updated) {
    setRequestData(list => list.map(r => r.id === updated.id ? updated : r));
    // also patch in global data so other screens see it
    window.AppData.REQUESTS = window.AppData.REQUESTS.map(r => r.id === updated.id ? updated : r);
  }

  const currentUser = isExternal
    ? { ...user, role: roleId, applicant: { email: user.name === 'דנה ארד' ? 'dana@autotrading.co.il' : '' }, company: user.company }
    : { ...user, role: roleId };

  // Build page content
  let content;
  if (page === 'dashboard') {
    content = <Dashboard onNavigate={navigate} />;
  } else if (page === 'requests') {
    content = <RequestsList context="internal" currentUser={currentUser} onNavigate={navigate} />;
  } else if (page === 'permits') {
    content = <PermitsList context="internal" currentUser={currentUser} onNavigate={navigate} />;
  } else if (page === 'importers') {
    content = <ImportersList onNavigate={navigate} />;
  } else if (page === 'my-requests') {
    content = <RequestsList context="external" currentUser={currentUser} onNavigate={(p) => p === 'new-request' ? setPage('new-request') : navigate(p)} />;
  } else if (page === 'my-permits') {
    content = <PermitsList context="external" currentUser={currentUser} onNavigate={navigate} />;
  } else if (page === 'new-request') {
    content = <SubmissionWizard
      currentUser={currentUser}
      onCancel={() => setPage('my-requests')}
      onComplete={() => setPage('my-requests')}
    />;
  } else if (page.startsWith('request:')) {
    const id = page.split(':')[1];
    content = (
      <RequestDetail
        requestId={id}
        context={isExternal ? 'external' : 'internal'}
        currentUser={currentUser}
        onNavigate={navigate}
        onUpdateRequest={updateRequestInList}
      />
    );
  } else {
    content = <Dashboard onNavigate={navigate} />;
  }

  // Internal nav
  const internalNav = [
    { id: 'dashboard', label: 'דשבורד',         icon: <Icons.Dashboard size={16}/> },
    { id: 'requests',  label: 'בקשות',           icon: <Icons.Inbox size={16}/>,        count: requestData.filter(r => !['approved','rejected','draft'].includes(r.status)).length },
    { id: 'permits',   label: 'רישיונות',         icon: <Icons.Award size={16}/>,        count: window.AppData.PERMITS.length },
    { id: 'importers', label: 'יבואנים',          icon: <Icons.Building size={16}/>,    count: window.AppData.IMPORTERS.length },
  ];

  // External nav (top bar style)
  const externalNav = [
    { id: 'my-requests', label: 'הבקשות שלי' },
    { id: 'my-permits',  label: 'הרישיונות שלי' },
  ];

  return (
    <div className="app" data-external={isExternal}>
      {/* Internal sidebar */}
      {!isExternal && (
        <aside className="sidebar">
          <div className="sidebar-brand">
            <div className="brand-mark">כ</div>
            <div>
              <div className="brand-text">כרם</div>
              <div className="brand-sub">רישיונות יבואן</div>
            </div>
          </div>

          <div className="sidebar-section">
            <div className="sidebar-section-title">ניהול</div>
            {internalNav.map(n => (
              <div
                key={n.id}
                className="nav-item"
                aria-current={page === n.id || (n.id === 'requests' && page.startsWith('request:'))}
                onClick={() => navigate(n.id)}
              >
                {n.icon}
                <span>{n.label}</span>
                {n.count !== undefined && <span className="nav-count">{n.count}</span>}
              </div>
            ))}
          </div>

          <div className="sidebar-section">
            <div className="sidebar-section-title">תפעול</div>
            <div className="nav-item"><Icons.Mail size={16}/><span>תבניות מייל</span></div>
            <div className="nav-item"><Icons.History size={16}/><span>לוגים</span></div>
            <div className="nav-item"><Icons.Users size={16}/><span>תפקידים והרשאות</span></div>
            <div className="nav-item"><Icons.Settings size={16}/><span>הגדרות מערכת</span></div>
          </div>

          <div className="sidebar-footer">
            <div className="row gap-2">
              <Avatar user={user} size={28} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="text-sm font-medium" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{user.name}</div>
                <div className="text-xs text-muted">{user.dept}</div>
              </div>
              <Button variant="ghost" size="sm" icon={<Icons.Logout size={14}/>} title="התנתקות" />
            </div>
          </div>
        </aside>
      )}

      {/* Main column */}
      <div>
        {isExternal ? (
          <div className="ext-header">
            <div className="brand">
              <div className="brand-mark">כ</div>
              <div>
                <div className="brand-text">כרם</div>
                <div className="brand-sub">פורטל יבואנים</div>
              </div>
            </div>
            <div className="ext-nav">
              {externalNav.map(n => (
                <div
                  key={n.id}
                  className="ext-nav-item"
                  aria-current={page === n.id || (n.id === 'my-requests' && (page === 'new-request' || page.startsWith('request:')))}
                  onClick={() => navigate(n.id)}
                >{n.label}</div>
              ))}
            </div>
            <div className="topbar-spacer" />
            <RoleSwitcher roleId={roleId} role={role} user={user} isOpen={roleMenuOpen} setOpen={setRoleMenuOpen} onSwitch={switchRole} />
          </div>
        ) : (
          <div className="topbar">
            <div>
              <div className="topbar-title">
                {page === 'dashboard' && 'דשבורד ניהולי'}
                {page === 'requests' && 'בקשות'}
                {page === 'permits' && 'רישיונות'}
                {page === 'importers' && 'יבואנים'}
                {page.startsWith('request:') && 'בחינת בקשה'}
              </div>
            </div>
            <div className="topbar-spacer" />
            <div className="topbar-search">
              <input placeholder="חיפוש בקשות, רישיונות, יבואנים..." />
              <Icons.Search size={13} />
            </div>
            <Button variant="ghost" size="sm" icon={<Icons.Bell size={15}/>} title="התראות" />
            <Button variant="ghost" size="sm" icon={<Icons.HelpCircle size={15}/>} title="עזרה" />
            <RoleSwitcher roleId={roleId} role={role} user={user} isOpen={roleMenuOpen} setOpen={setRoleMenuOpen} onSwitch={switchRole} />
          </div>
        )}

        {content}
      </div>
    </div>
  );
}

// ============================================================
// Role Switcher
// ============================================================

function RoleSwitcher({ roleId, role, user, isOpen, setOpen, onSwitch }) {
  const { ROLES, USERS } = window.AppData;
  const ref = React.useRef(null);
  React.useEffect(() => {
    function onClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, []);

  return (
    <div className="role-switcher" ref={ref}>
      <div className="role-pill" onClick={() => setOpen(o => !o)}>
        <div className="role-info">
          <span className="role-name">{user.name}</span>
          <span className="role-title">{role.label}</span>
        </div>
        <Avatar user={user} size={28} />
      </div>
      {isOpen && (
        <div className="role-dropdown">
          <div className="role-dropdown-header">החלף תפקיד (לצורך הדגמה)</div>
          {ROLES.map(r => {
            const u = USERS[r.id];
            return (
              <div
                key={r.id}
                className="role-option"
                aria-selected={r.id === roleId}
                onClick={() => onSwitch(r.id)}
              >
                <Avatar user={u} size={30} />
                <div className="role-option-text" style={{ flex: 1 }}>
                  <div className="role-name">{u.name}</div>
                  <div className="role-title">{r.label}</div>
                </div>
                {r.id === roleId && <Icons.Check size={14} color="var(--accent)" />}
              </div>
            );
          })}
          <div className="role-divider" />
          <div className="role-dropdown-header" style={{ paddingBottom: 4 }}>
            <span className="text-xs">תפקידים פנימיים = משרד התחבורה. מייצג = פורטל היבואן.</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// Mount
// ============================================================

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ToastProvider>
    <App />
  </ToastProvider>
);
  </script>
</body>
</html>
